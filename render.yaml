# Render Blueprint — deploy Lumbercorp Pathfinder as a free static site.
#
# No environment variables needed: each visitor enters their own Torn API key
# in the UI, and the browser talks to api.torn.com directly (CORS allowed).
#
# Alternative (if you prefer a Web Service with the /api/torn proxy):
#   - type: web, runtime: node, buildCommand: npm install && npm run build,
#     startCommand: npm start   (see server.js and README.md)
services:
  - type: web
    name: lumbercorp-pathfinder
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
